[project]
name = "irecho"
version = "0.1.0"
description = "WISE/NEOWISE mid-infrared light-curve pipeline for AGN dust echoes (stage 1-2: pipeline + known-answer tests)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "requests>=2.31", "pyarrow>=15", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cached: regression tests that need the local IRSA cache (skipped when it is absent)"]
